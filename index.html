<style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const Lucide = window.LucideReact || {};
const icon = (name) => Lucide[name] || (() => null);
const Home = icon('Home'), Clock = icon('Clock'), Sparkles = icon('Sparkles'), Quote = icon('Quote'),
  Trophy = icon('Trophy'), CheckCircle2 = icon('CheckCircle2'), XCircle = icon('XCircle'), RotateCcw = icon('RotateCcw'),
  ArrowRight = icon('ArrowRight'), Lightbulb = icon('Lightbulb'), BookOpen = icon('BookOpen'), Target = icon('Target'),
  HelpCircle = icon('HelpCircle'), ChevronDown = icon('ChevronDown'),
  SpellCheck = icon('SpellCheck'), Volume2 = icon('Volume2'), Loader2 = icon('Loader2'), Square = icon('Square'),
  Wand2 = icon('Wand2'), AlertTriangle = icon('AlertTriangle'),
  Menu = icon('Menu'), X = icon('X'), Languages = icon('Languages'), PlayCircle = icon('PlayCircle');

/* ---------- Данные ---------- */
const TENSES = {
  past: {
    name: 'Past Simple', ru: 'Прошедшее простое', color: 'indigo',
    when: 'Действие завершилось в прошлом.',
    formula: [
      { label: 'Утверждение', f: 'Subject + V2 (verb-ed)' },
      { label: 'Отрицание', f: 'Subject + did not + V1' },
      { label: 'Вопрос', f: 'Did + Subject + V1 ?' },
    ],
    markers: ['yesterday', 'last week', 'ago', 'in 2020'],
    examples: [
      { type: 'Утверждение', en: 'I watched a film yesterday.', ru: 'Я смотрел фильм вчера.' },
      { type: 'Отрицание', en: "She didn't go to school last week.", ru: 'Она не ходила в школу на прошлой неделе.' },
      { type: 'Вопрос', en: 'Did you call your mom?', ru: 'Ты звонил маме?' },
    ],
  },
  present: {
    name: 'Present Simple', ru: 'Настоящее простое', color: 'blue',
    when: 'Привычки, факты, регулярные действия.',
    formula: [
      { label: 'Утверждение', f: 'Subject + V1 (he/she/it + -s)' },
      { label: 'Отрицание', f: "Subject + do/does not + V1" },
      { label: 'Вопрос', f: 'Do/Does + Subject + V1 ?' },
    ],
    markers: ['every day', 'usually', 'often', 'always'],
    examples: [
      { type: 'Утверждение', en: 'He plays football every day.', ru: 'Он играет в футбол каждый день.' },
      { type: 'Отрицание', en: "I don't like coffee.", ru: 'Я не люблю кофе.' },
      { type: 'Вопрос', en: 'Does she live in London?', ru: 'Она живёт в Лондоне?' },
    ],
  },
  future: {
    name: 'Future Simple', ru: 'Будущее простое', color: 'green',
    when: 'Решения в момент речи, прогнозы, обещания.',
    formula: [
      { label: 'Утверждение', f: 'Subject + will + V1' },
      { label: 'Отрицание', f: "Subject + will not (won't) + V1" },
      { label: 'Вопрос', f: 'Will + Subject + V1 ?' },
    ],
    markers: ['tomorrow', 'next year', 'soon', 'in two days'],
    examples: [
      { type: 'Утверждение', en: 'We will visit Paris next summer.', ru: 'Мы посетим Париж следующим летом.' },
      { type: 'Отрицание', en: "They won't be late.", ru: 'Они не опоздают.' },
      { type: 'Вопрос', en: 'Will you help me tomorrow?', ru: 'Ты поможешь мне завтра?' },
    ],
  },
};

const TENSE_QUIZ = [
  {
    id: 't1', before: 'I', after: 'to the cinema yesterday.', options: ['go', 'went', 'will go'], answer: 'went',
    explain: 'Слово «yesterday» (вчера) указывает на прошлое — нужен Past Simple: go → went (неправильный глагол).',
  },
  {
    id: 't2', before: 'She', after: 'tea every morning.', options: ['drinks', 'drank', 'will drink'], answer: 'drinks',
    explain: '«Every morning» — регулярное действие, это Present Simple. С she добавляем окончание -s: drinks.',
  },
  {
    id: 't3', before: 'We', after: 'you tomorrow.', options: ['call', 'called', 'will call'], answer: 'will call',
    explain: '«Tomorrow» (завтра) — будущее, нужен Future Simple: will + глагол без изменений.',
  },
];

const PRONOUNS = [
  { p: 'I', ru: 'я', form: 'am', short: "I'm" },
  { p: 'You', ru: 'ты / вы', form: 'are', short: "You're" },
  { p: 'He', ru: 'он', form: 'is', short: "He's" },
  { p: 'She', ru: 'она', form: 'is', short: "She's" },
  { p: 'It', ru: 'оно / это', form: 'is', short: "It's" },
  { p: 'We', ru: 'мы', form: 'are', short: "We're" },
  { p: 'They', ru: 'они', form: 'are', short: "They're" },
];
const COMPLEMENTS = [
  { en: 'happy', ru: 'счастлив(ы)', plural: 'happy' },
  { en: 'a student', ru: 'студент', plural: 'students' },
  { en: 'at home', ru: 'дома', plural: 'at home' },
  { en: 'from Russia', ru: 'из России', plural: 'from Russia' },
];
const POS_OPTS = ['am', 'is', 'are'];
const NEG_OPTS = ['am not', "isn't", "aren't"];
const Q_OPTS = ['Am', 'Is', 'Are'];
const TOBE_QUIZ = [
  { id: 'b1', group: 'pos', options: POS_OPTS, before: 'My brother', after: 'a doctor.', answer: 'is', explain: '«My brother» = he (он), а с he используем is.' },
  { id: 'b2', group: 'pos', options: POS_OPTS, before: 'The children', after: 'in the park.', answer: 'are', explain: '«The children» — это они (they), множественное число: are.' },
  { id: 'b3', group: 'pos', options: POS_OPTS, before: 'I', after: 'ready!', answer: 'am', explain: 'С местоимением I всегда используется только am.' },
  { id: 'b4', group: 'neg', options: NEG_OPTS, before: 'She', after: 'at school today.', answer: "isn't", explain: "She → is, а в отрицании is not = isn't. Она не в школе сегодня." },
  { id: 'b5', group: 'neg', options: NEG_OPTS, before: 'We', after: 'tired.', answer: "aren't", explain: "We → are, отрицание: are not = aren't. Мы не устали." },
  { id: 'b6', group: 'neg', options: NEG_OPTS, before: 'I', after: 'hungry.', answer: 'am not', explain: "С I только am not (коротко I'm not). Формы «amn't» в английском нет." },
  { id: 'b7', group: 'q', options: Q_OPTS, before: '', after: 'you a teacher?', answer: 'Are', explain: 'You → are. В вопросе форма to be встаёт перед подлежащим: Are you…?' },
  { id: 'b8', group: 'q', options: Q_OPTS, before: '', after: 'it cold today?', answer: 'Is', explain: 'It → is. Вопрос начинается с Is: Is it cold today?' },
  { id: 'b9', group: 'q', options: Q_OPTS, before: '', after: 'I late?', answer: 'Am', explain: 'I → am. Вопрос: Am I late? — Я опоздал?' },
];
const TOBE_GROUPS = [
  { key: 'pos', title: 'Утверждение: am, is или are?' },
  { key: 'neg', title: "Отрицание: am not, isn't или aren't?" },
  { key: 'q', title: 'Вопрос: с чего начать — Am, Is или Are?' },
];

const IRREGULAR_VERBS = [
  ['be', 'was / were', 'быть'], ['go', 'went', 'идти, ехать'], ['have', 'had', 'иметь'], ['do', 'did', 'делать'],
  ['see', 'saw', 'видеть'], ['come', 'came', 'приходить'], ['eat', 'ate', 'есть'], ['drink', 'drank', 'пить'],
  ['take', 'took', 'брать'], ['make', 'made', 'делать, создавать'], ['buy', 'bought', 'покупать'], ['write', 'wrote', 'писать'],
  ['read', 'read [red]', 'читать'], ['get', 'got', 'получать'], ['give', 'gave', 'давать'], ['know', 'knew', 'знать'],
  ['think', 'thought', 'думать'], ['say', 'said', 'сказать'], ['find', 'found', 'находить'], ['sleep', 'slept', 'спать'],
  ['speak', 'spoke', 'говорить'], ['swim', 'swam', 'плавать'], ['run', 'ran', 'бегать'], ['meet', 'met', 'встречать'],
];

const IRREGULAR_PLURALS = [
  ['man', 'men', "men's", 'мужчины'], ['woman', 'women', "women's", 'женщины'], ['child', 'children', "children's", 'дети'],
  ['person', 'people', "people's", 'люди'], ['ox', 'oxen', "oxen's", 'быки'],
  ['mouse', 'mice', "mice's", 'мыши'], ['goose', 'geese', "geese's", 'гуси'],
  ['sheep', 'sheep', "sheep's", 'овцы'], ['fish', 'fish', "fish's", 'рыбы'],
];

const APOS = [
  { id: 'a1', word: 'Toms', rest: 'car is red.', pre: '', hint: 'машина Тома', correct: 3, result: "Tom's",
    explain: 'Том — один человек, имя в единственном числе: добавляем \'s → Tom\'s.' },
  { id: 'a2', word: 'girls', rest: 'bag', pre: 'the', hint: 'сумка одной девочки', correct: 4, result: "girl's",
    explain: 'Одна девочка — girl. Единственное число: girl + \'s → the girl\'s bag.' },
  { id: 'a3', word: 'girls', rest: 'bags', pre: 'the', hint: 'сумки нескольких девочек', correct: 5, result: "girls'",
    explain: 'Девочек много — girls уже оканчивается на -s, поэтому ставим только апостроф после s: girls\'.' },
  { id: 'a4', word: 'childrens', rest: 'toys', pre: 'the', hint: 'игрушки детей', correct: 8, result: "children's",
    explain: 'Children — неправильное множественное число без -s на конце, поэтому добавляем \'s: children\'s.' },
  { id: 'a5', word: 'parents', rest: 'house', pre: 'my', hint: 'дом моих родителей (мамы и папы)', correct: 7, result: "parents'",
    explain: 'Родителей двое — parents (мн. ч. на -s). Апостроф ставим после s: parents\'.' },
];

const TOTAL = TENSE_QUIZ.length + TOBE_QUIZ.length + APOS.length;

/* ---------- Хранилище прогресса ---------- */
const STORE_KEY = 'eegh-progress-v1';
function loadProgress() {
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; }
}
function saveProgress(p) { try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) {} }

/* ---------- Мелкие компоненты ---------- */
const tone = {
  blue: { soft: 'bg-blueSoft', text: 'text-blue', border: 'border-blue', solid: 'bg-blue' },
  indigo: { soft: 'bg-indigoSoft', text: 'text-indigo', border: 'border-indigo', solid: 'bg-indigo' },
  green: { soft: 'bg-greenSoft', text: 'text-green', border: 'border-green', solid: 'bg-green' },
};

function SectionTitle({ eyebrow, title, children }) {
  return (
    <div className="mb-6">
      <p className="text-xs uppercase tracking-[0.12em] text-muted font-medium">{eyebrow}</p>
      <h2 className="font-display text-3xl sm:text-4xl font-semibold mt-1">{title}</h2>
      {children && <p className="text-muted mt-2 max-w-[62ch]">{children}</p>}
    </div>
  );
}

function Panel({ children, className = '' }) {
  return <section className={`bg-surface border border-line rounded-2xl p-5 sm:p-6 ${className}`}>{children}</section>;
}

function HintButton({ id, label, children }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="bg-surface border border-line rounded-2xl overflow-hidden">
      <button id={id} onClick={() => setOpen((o) => !o)} aria-expanded={open}
        className={`w-full flex items-center gap-2 px-5 py-3.5 text-left font-medium transition-colors duration-200 ${open ? 'bg-amberSoft' : 'hover:bg-surface2'}`}>
        <HelpCircle size={19} className="text-amber shrink-0" />
        <span className="flex-1">{label}</span>
        <span className="text-xs text-muted hidden sm:inline">{open ? 'Скрыть' : 'Показать'}</span>
        <ChevronDown size={18} className={`text-muted transition-transform duration-300 ${open ? 'rotate-180' : ''}`} />
      </button>
      <div className={`grid transition-[grid-template-rows] duration-300 ease-out ${open ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'}`}>
        <div className="overflow-hidden" aria-hidden={!open}>
          <div className="px-5 pb-5 pt-4 border-t border-line">{children}</div>
        </div>
      </div>
    </div>
  );
}

function Feedback({ ok, text }) {
  return (
    <div className={`fade-in mt-3 flex gap-2 items-start rounded-xl px-3 py-2.5 text-sm ${ok ? 'bg-greenSoft' : 'bg-redSoft'}`}>
      {ok ? <CheckCircle2 size={18} className="text-green shrink-0 mt-0.5" /> : <XCircle size={18} className="text-red shrink-0 mt-0.5" />}
      <span>{ok ? 'Верно! ' : 'Не совсем. '}{text}</span>
    </div>
  );
}

function ChoiceQuestion({ q, index, options, solved, onCorrect }) {
  const [picked, setPicked] = useState(null);
  const done = picked === q.answer;
  return (
    <div className="border-t border-line pt-4 first:border-t-0 first:pt-0">
      <p className="text-sm text-muted tnum">Вопрос {index + 1}</p>
      <p className="text-lg mt-1">
        {q.before} <span className={`inline-block min-w-[4.5rem] text-center border-b-2 px-1 transition-colors duration-300 ${done ? 'border-green text-green font-semibold' : 'border-line text-muted'}`}>{done ? q.answer : '___'}</span> {q.after}
      </p>
      <div className="flex flex-wrap gap-2 mt-3">
        {options.map((opt) => {
          const isPicked = picked === opt;
          const isRight = opt === q.answer;
          let cls = 'bg-surface2 border-line hover:border-indigo hover:-translate-y-0.5';
          if (isPicked && isRight) cls = 'bg-greenSoft border-green text-green';
          if (isPicked && !isRight) cls = 'bg-redSoft border-red text-red';
          if (done && !isPicked) cls = 'bg-surface2 border-line opacity-50';
          return (
            <button key={opt} disabled={done}
              onClick={() => { setPicked(opt); if (isRight) onCorrect(q.id); }}
              className={`px-4 py-2 rounded-xl border-2 font-medium transition-all duration-200 ${cls}`}>
              {opt}
            </button>
          );
        })}
        {solved && picked === null && <span className="text-xs text-green self-center flex items-center gap-1"><CheckCircle2 size={14} /> уже решено раньше</span>}
      </div>
      {picked && <Feedback ok={done} text={done ? q.explain : `Подсказка: ${q.explain}`} />}
    </div>
  );
}

/* ---------- Главная ---------- */
function HomeView({ progress, go, reset }) {
  const correct = Object.keys(progress).length;
  const pct = Math.round((correct / TOTAL) * 100);
  const bySection = [
    { key: 'tenses', title: 'Времена глаголов', desc: 'Present, Past, Future Simple на одной шкале времени', icon: Clock, t: 'blue', done: TENSE_QUIZ.filter(q => progress[q.id]).length, total: TENSE_QUIZ.length },
    { key: 'tobe', title: 'Глагол TO BE', desc: 'Конструктор: am, is или are', icon: Sparkles, t: 'indigo', done: TOBE_QUIZ.filter(q => progress[q.id]).length, total: TOBE_QUIZ.length },
    { key: 'possessive', title: 'Притяжательный падеж', desc: "Где ставить апостроф: 's или s'", icon: Quote, t: 'green', done: APOS.filter(q => progress[q.id]).length, total: APOS.length },
  ];
  const r = 52, c = 2 * Math.PI * r;
  return (
    <div className="fade-in space-y-6">
      <h1 className="sr-only">Easy English Grammar Hub</h1>
      <div className="relative rounded-3xl overflow-hidden border border-line shadow-sm">
        <div className="hero-art hero-in w-full" role="img"
          aria-label="Easy English Grammar Hub: семья и друзья учат английский за ноутбуком в уютном северном доме, за окном снег и северное сияние" />
        <div className="hero-shade absolute inset-0 pointer-events-none" />
        <div className="absolute left-0 right-0 bottom-0 p-3 sm:p-5 flex flex-wrap items-end justify-between gap-3">
          <button onClick={() => go('tenses')}
            className="inline-flex items-center gap-2 bg-indigo text-surface px-4 py-2 sm:px-6 sm:py-3 rounded-xl font-medium text-sm sm:text-base shadow-lg transition-transform duration-200 hover:-translate-y-0.5">
            Начать обучение <ArrowRight size={18} />
          </button>
        </div>
      </div>

      <div className="grid gap-6 md:grid-cols-[1.4fr_1fr] items-stretch">
        <Panel className="flex flex-col justify-center">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <p className="text-xs uppercase tracking-[0.12em] text-muted font-medium">Грамматика для начинающих · A1–A2</p>
          </div>

/* ---------- TO BE ---------- */
function ToBeView({ progress, onCorrect }) {
  const [pi, setPi] = useState(2);
  const [mode, setMode] = useState('pos');
  const [ci, setCi] = useState(0);
  const P = PRONOUNS[pi];
  const C = COMPLEMENTS[ci];
  const pluralSubj = ['We', 'They'].includes(P.p);
  const comp = pluralSubj ? C.plural : C.en;

  let parts;
  if (mode === 'pos') parts = [P.p, P.form, comp + '.'];
  else if (mode === 'neg') parts = [P.p, P.form + ' not', comp + '.'];
  else parts = [P.form.charAt(0).toUpperCase() + P.form.slice(1), P.p === 'I' ? 'I' : P.p.toLowerCase(), comp + '?'];
  const shortNote = mode === 'pos' ? `Коротко: ${P.short} ${comp}.` : mode === 'neg'
    ? `Коротко: ${P.p === 'I' ? "I'm not" : P.form === 'is' ? `${P.p} isn't` : `${P.p} aren't`} ${comp}.` : 'В вопросе форма to be выходит на первое место.';
  const ruPron = P.ru.split(' / ')[0];
  const ru = mode === 'pos' ? `${ruPron} — ${C.ru}.` : mode === 'neg' ? `${ruPron} не ${C.ru}.` : `${ruPron} ${C.ru}?`;

  return (
    <div className="fade-in space-y-6">
      <SectionTitle eyebrow="Раздел 2" title="Глагол TO BE">В русском мы часто пропускаем «есть», а в английском to be обязателен. Выберите местоимение — конструктор сам подберёт форму и соберёт предложение.</SectionTitle>

      <Panel>
        <p className="text-sm text-muted mb-2">1. Кто?</p>
        <div className="flex flex-wrap gap-2">
          {PRONOUNS.map((p, i) => (
            <button key={p.p} onClick={() => setPi(i)}
              className={`px-4 py-2 rounded-xl border-2 transition-all duration-200 ${pi === i ? 'bg-indigo border-indigo text-surface scale-105' : 'bg-surface2 border-line hover:border-indigo'}`}>
              <span className="font-semibold">{p.p}</span> <span className={`text-xs ${pi === i ? '' : 'text-muted'}`}>{p.ru}</span>
            </button>
          ))}
        </div>

        <p className="text-sm text-muted mb-2 mt-5">2. Форма глагола</p>
        <div className="grid grid-cols-3 gap-3">
          {['am', 'is', 'are'].map((f) => {
            const on = P.form === f;
            return (
              <div key={f} className={`rounded-xl border-2 py-3 text-center transition-all duration-300 ${on ? 'border-green bg-greenSoft scale-[1.03]' : 'border-line bg-surface2 opacity-50'}`}>
                <p className={`font-display text-2xl font-semibold ${on ? 'text-green' : ''}`}>{f}</p>
                <p className="text-xs text-muted">{f === 'am' ? 'только I' : f === 'is' ? 'he, she, it' : 'you, we, they'}</p>
              </div>
            );
          })}
        </div>

        <div className="grid gap-5 sm:grid-cols-2 mt-5">
          <div>
            <p className="text-sm text-muted mb-2">3. Тип предложения</p>
            <div className="inline-flex bg-surface2 rounded-xl p-1 border border-line">
              {[['pos', 'Утверждение'], ['neg', 'Отрицание'], ['q', 'Вопрос']].map(([k, l]) => (
                <button key={k} onClick={() => setMode(k)} className={`px-3 py-1.5 rounded-lg text-sm transition-all duration-200 ${mode === k ? 'bg-surface shadow-sm font-medium text-indigo' : 'text-muted'}`}>{l}</button>
              ))}
            </div>
          </div>
          <div>
            <p className="text-sm text-muted mb-2">4. Окончание</p>
            <div className="flex flex-wrap gap-2">
              {COMPLEMENTS.map((c, i) => (
                <button key={c.en} onClick={() => setCi(i)} className={`px-3 py-1.5 rounded-lg text-sm border transition-all duration-200 ${ci === i ? 'border-blue bg-blueSoft text-blue font-medium' : 'border-line hover:border-blue'}`}>{c.en}</button>
              ))}
            </div>
          </div>
        </div>

        <div className="mt-6 rounded-2xl bg-surface2 border border-line p-5">
          <p className="text-xs uppercase tracking-wider text-muted">Готовое предложение</p>
          <div key={`${pi}-${mode}-${ci}`} className="flex flex-wrap gap-2 mt-3">
            {parts.map((w, i) => {
              const isVerb = (mode === 'q' && i === 0) || (mode !== 'q' && i === 1);
              return (
                <span key={i} className={`pop px-3 py-1.5 rounded-lg text-xl font-medium ${isVerb ? 'bg-greenSoft text-green' : 'bg-surface border border-line'}`} style={{ animationDelay: `${i * 90}ms` }}>{w}</span>
              );
            })}
          </div>
          <p className="mt-3 text-muted">{ru.charAt(0).toUpperCase() + ru.slice(1)}</p>
          <p className="mt-1 text-sm text-muted">{shortNote}</p>
        </div>
      </Panel>

      {TOBE_GROUPS.map((g, gi) => (
        <Panel key={g.key}>
          <div className="flex flex-wrap items-baseline justify-between gap-2">
            <h3 className="font-display text-xl font-semibold flex items-center gap-2"><Target size={20} className="text-indigo" /> {g.title}</h3>
            <span className="text-xs text-muted tnum">Тест {gi + 1} из {TOBE_GROUPS.length}</span>
          </div>
          <div className="mt-4 space-y-5">
            {TOBE_QUIZ.filter((q) => q.group === g.key).map((q, i) => <ChoiceQuestion key={q.id} q={q} index={i} options={q.options} solved={!!progress[q.id]} onCorrect={onCorrect} />)}
          </div>
        </Panel>
      ))}
    </div>
  );
}

/* ---------- Притяжательный падеж ---------- */
const COMPARE = [
  { key: 'one', label: 'Один', base: 'cat', owner: "cat's", thing: 'toy', ru: 'игрушка кошки', rule: "Единственное число → + 's", count: 1 },
  { key: 'many', label: 'Много (на -s)', base: 'cats', owner: "cats'", thing: 'toys', ru: 'игрушки кошек', rule: "Множественное на -s → только '", count: 3 },
  { key: 'irr', label: 'Много (без -s)', base: 'children', owner: "children's", thing: 'toys', ru: 'игрушки детей', rule: "Неправильное множественное → + 's", count: 3 },
];

function ApostropheTask({ t, index, solved, onCorrect }) {
  const [picked, setPicked] = useState(null);
  const ok = picked === t.correct;
  const letters = t.word.split('');
  const shown = picked === null ? t.word : t.word.slice(0, picked) + "'" + t.word.slice(picked);
  return (
    <div className="border-t border-line pt-4 first:border-t-0 first:pt-0">
      <div className="flex flex-wrap items-baseline justify-between gap-2">
        <p className="text-sm text-muted tnum">Задание {index + 1} · <span className="text-ink">{t.hint}</span></p>
        {solved && picked === null && <span className="text-xs text-green inline-flex items-center gap-1"><CheckCircle2 size={14} /> уже решено раньше</span>}
      </div>
      <div className="mt-2 flex flex-wrap items-center gap-x-2 gap-y-1 text-xl">
        {t.pre && <span>{t.pre.charAt(0).toUpperCase() + t.pre.slice(1)}</span>}
        <span className="inline-flex items-center">
          {letters.map((ch, i) => (
            <React.Fragment key={i}>
              {i > 0 && <Gap i={i} picked={picked} ok={ok} disabled={ok} onPick={setPicked} correct={t.correct} onRight={() => onCorrect(t.id)} />}
              <span className="font-medium">{ch}</span>
            </React.Fragment>
          ))}
          <Gap i={letters.length} picked={picked} ok={ok} disabled={ok} onPick={setPicked} correct={t.correct} onRight={() => onCorrect(t.id)} />
        </span>
        <span>{t.rest}</span>
      </div>
      {picked !== null && (
        <Feedback ok={ok} text={ok ? t.explain : `У вас получилось «${shown}». ${t.explain}`} />
      )}
    </div>
  );
}

function Gap({ i, picked, ok, disabled, onPick, correct, onRight }) {
  const isPicked = picked === i;
  let cls = 'text-transparent hover:text-indigo hover:bg-indigoSoft';
  if (isPicked && ok) cls = 'text-green bg-greenSoft';
  if (isPicked && !ok) cls = 'text-red bg-redSoft';
  return (
    <button aria-label={`Поставить апостроф после буквы ${i}`} disabled={disabled}
      onClick={() => { onPick(i); if (i === correct) onRight(); }}
      className={`relative w-4 h-9 -mx-0.5 rounded transition-all duration-200 font-bold ${cls} ${disabled && !isPicked ? 'pointer-events-none' : ''}`}>
      <span className="absolute inset-x-0 top-0.5">'</span>
      {!disabled && !isPicked && <span className="absolute left-1/2 -translate-x-1/2 bottom-1 w-1 h-1 rounded-full bg-line" />}
    </button>
  );
}

            </tbody>
          </table>
        </div>
        <p className="text-sm text-muted mt-3">Сравните: <span className="text-ink">the boys' room</span> (boys на -s → только ') и <span className="text-ink">the men's room</span> (men без -s → 's).</p>
      </HintButton>

      <Panel>
        <h3 className="font-display text-xl font-semibold flex items-center gap-2"><Target size={20} className="text-indigo" /> Вставьте апостроф в правильное место</h3>
        <p className="text-sm text-muted mt-1">Нажмите на промежуток между буквами (или после слова), куда нужно поставить апостроф.</p>
        <div className="mt-4 space-y-5">
          {APOS.map((t, k) => <ApostropheTask key={t.id} t={t} index={k} solved={!!progress[t.id]} onCorrect={onCorrect} />)}
        </div>
      </Panel>
    </div>
  );
}

/* ---------- Проверка текста ---------- */
const CHECK_SAMPLE = 'Yesterday I go to the park with my friend. He have a dog. The dog are very funny and we was happy. Do you likes dogs?';

function buildCheckPrompt(text) {
  return [
    'You are a friendly English teacher for Russian-speaking beginners (A1–A2).',
    'Check the student\'s English text below for grammar, spelling, punctuation and word-choice mistakes.',
    'Reply with ONLY a JSON object of this shape:',
    '{"errors":[{"wrong":"exact fragment copied from the text","correct":"fixed fragment","type":"grammar|spelling|punctuation|word choice","explain":"short explanation in Russian, 1-2 sentences, simple words, name the rule"}],"corrected":"the whole text with all fixes","translation":"natural Russian translation of the corrected text","summary":"one encouraging sentence in Russian"}',
    'Rules: "wrong" must be copied character-for-character from the text and be as short as possible (a few words). List every mistake once, in the order they appear. Do not invent mistakes in correct text. If there are no mistakes, return an empty "errors" array.',
    '',
    'Student text:',
    '"""',
    text,
    '"""',
  ].join('\n');
}

/* Простая офлайн-проверка (если Claude недоступен, например на GitHub Pages) */
const OFFLINE_RULES = [
  { re: /\b(he|she|it)\s+(have)\b/gi, fix: (m, s) => `${s} has`, explain: 'С he/she/it используется has, а не have.' },
  { re: /\b(he|she|it)\s+(don't|do not)\b/gi, fix: (m, s) => `${s} doesn't`, explain: "С he/she/it отрицание строится через doesn't." },
  { re: /\b(I)\s+(is|are)\b/g, fix: () => 'I am', explain: 'С I используется только am.' },
  { re: /\b(he|she|it)\s+(are|am)\b/gi, fix: (m, s) => `${s} is`, explain: 'С he/she/it используется is.' },
  { re: /\b(we|they|you)\s+(is|am)\b/gi, fix: (m, s) => `${s} are`, explain: 'С we/you/they используется are.' },
  { re: /\b(we|they|you)\s+(was)\b/gi, fix: (m, s) => `${s} were`, explain: 'В прошедшем времени с we/you/they — were.' },
  { re: /\b(I|he|she|it)\s+(were)\b/g, fix: (m, s) => `${s} was`, explain: 'В прошедшем времени с I/he/she/it — was.' },
  { re: /\b(do|does|did)\s+(I|you|we|they|he|she|it)\s+([a-z]{2,}?)(s|ed)\b/gi, fix: (m, a, p, v) => `${a} ${p} ${v}`,
    explain: 'После do/does/did глагол стоит в начальной форме, без -s и -ed.', guard: (g) => g[3].toLowerCase() === 'ed' || !/s$/i.test(g[2]) },
  { re: /\ba\s+([aeiou]\w*)/gi, fix: (m, w) => `${m[0]}n ${w}`, explain: 'Перед словом, которое начинается с гласного звука, пишем an.', guard: (g) => !/^(uni|use|usu|eu|one|once)/i.test(g[0]) },
  { re: /\bi\b/g, fix: () => 'I', explain: 'Местоимение I всегда пишется с большой буквы.' },
  { re: /\b(yesterday|last \w+|ago)\b[^.?!]*?\b(I|we|they|you|he|she)\s+(go|have|see|come|eat|drink|buy|take|make|do)\b/gi,
    fix: null, explain: 'Есть слово-маркер прошлого (yesterday, last…, ago) — нужен Past Simple (V2).' },
];
function offlineCheck(text) {
  const errors = [];
  OFFLINE_RULES.forEach((r) => {
    text.replace(r.re, (...args) => {
      const m = args[0];
      const groups = args.slice(1, -2);
      if (r.guard && !r.guard(groups)) return m;
      if (r.fix) errors.push({ wrong: m, correct: r.fix(m, ...groups), type: 'grammar', explain: r.explain, index: args[args.length - 2] });
      else {
        const verb = groups[2];
        const map = { go: 'went', have: 'had', see: 'saw', come: 'came', eat: 'ate', drink: 'drank', buy: 'bought', take: 'took', make: 'made', do: 'did' };
        const frag = `${groups[1]} ${verb}`;
        errors.push({ wrong: frag, correct: `${groups[1]} ${map[verb.toLowerCase()]}`, type: 'grammar', explain: r.explain, index: args[args.length - 2] + m.lastIndexOf(frag) });
      }
      return m;
    });
  });
  errors.sort((a, b) => a.index - b.index);
  const seen = new Set();
  return errors.filter((e) => { const k = e.index + e.wrong; if (seen.has(k)) return false; seen.add(k); return true; });
}

/* LanguageTool: онлайн-база правил английской грамматики (используется вне Claude) */
const LT_URL = 'https://api.languagetool.org/v2/check';
const LT_CATEGORY_RU = {
  GRAMMAR: 'Грамматика: форма слова не согласуется с другими словами в предложении.',
  TYPOS: 'Орфография: слово написано с ошибкой или такого слова нет.',
  PUNCTUATION: 'Пунктуация: проверьте знаки препинания.',
  CASING: 'Заглавные буквы: предложение, имена и местоимение I пишутся с большой буквы.',
  CONFUSED_WORDS: 'Похожие слова: возможно, перепутаны слова, которые звучат или пишутся похоже.',
  COLLOCATIONS: 'Сочетание слов: так обычно не говорят, носитель сказал бы иначе.',
  REDUNDANCY: 'Лишнее слово: в предложении повтор или лишнее слово.',
  STYLE: 'Стиль: так можно сказать, но лучше иначе.',
  TYPOGRAPHY: 'Типографика: лишний пробел, кавычки или тире.',
  SEMANTICS: 'Смысл: проверьте, что предложение значит то, что вы хотели.',
  MISC: 'Другое: проверьте это место.',
};
const LT_TYPE_RU = { GRAMMAR: 'грамматика', TYPOS: 'орфография', PUNCTUATION: 'пунктуация', CASING: 'заглавные буквы', CONFUSED_WORDS: 'похожие слова', STYLE: 'стиль', TYPOGRAPHY: 'типографика', REDUNDANCY: 'лишнее', COLLOCATIONS: 'сочетание слов' };

async function languageToolCheck(text, signal) {
  const body = new URLSearchParams({ text, language: 'en-US', motherTongue: 'ru', level: 'default' });
  const res = await fetch(LT_URL, { method: 'POST', body, signal, headers: { Accept: 'application/json' } });
  if (res.status === 429) { const err = new Error('rate'); err.code = 'lt_rate'; throw err; }
  if (!res.ok) throw new Error('LanguageTool HTTP ' + res.status);
  const data = await res.json();
  const matches = Array.isArray(data.matches) ? data.matches : [];
  const errors = matches
    .filter((m) => typeof m.offset === 'number' && m.length > 0)
    .map((m) => {
      const cat = (m.rule && m.rule.category && m.rule.category.id) || 'MISC';
      const wrong = text.substr(m.offset, m.length);
      const correct = (m.replacements && m.replacements[0] && m.replacements[0].value) || '';
      return {
        wrong, correct: correct || '—', index: m.offset, type: LT_TYPE_RU[cat] || 'другое',
        explain: LT_CATEGORY_RU[cat] || LT_CATEGORY_RU.MISC,
        original: m.message || '', alts: (m.replacements || []).slice(1, 4).map((r) => r.value),
      };
    })
    .sort((a, b) => a.index - b.index);
  let corrected = text;
  [...errors].reverse().forEach((e) => { if (e.correct !== '—') corrected = corrected.slice(0, e.index) + e.correct + corrected.slice(e.index + e.wrong.length); });
  return { errors, corrected };
}

/* Найти фрагменты ошибок в тексте по порядку, чтобы подсветить их */
function locateErrors(text, errors) {
  const spans = [];
  let from = 0;
  errors.forEach((e, i) => {
    if (!e.wrong) return;
    if (typeof e.index === 'number' && text.substr(e.index, e.wrong.length) === e.wrong) {
      if (!spans.some((s) => e.index < s.end && e.index + e.wrong.length > s.start)) spans.push({ start: e.index, end: e.index + e.wrong.length, i });
      return;
    }
    let at = text.indexOf(e.wrong, from);
    if (at < 0) at = text.toLowerCase().indexOf(e.wrong.toLowerCase());
    if (at < 0) return;
    if (spans.some((s) => at < s.end && at + e.wrong.length > s.start)) return;
    spans.push({ start: at, end: at + e.wrong.length, i });
    from = at + e.wrong.length;
  });
  spans.sort((a, b) => a.start - b.start);
  const parts = [];
  let pos = 0;
  spans.forEach((s) => {
    if (s.start > pos) parts.push({ t: text.slice(pos, s.start) });
    parts.push({ t: text.slice(s.start, s.end), i: s.i });
    pos = s.end;
  });
  if (pos < text.length) parts.push({ t: text.slice(pos) });
  return parts;
}

const SAMPLE_ERRORS = {
  not_granted: 'Проверка через Claude не разрешена для этой страницы. Включена простая проверка.',
  sampling_disabled: 'Claude недоступен для этого аккаунта. Включена простая проверка.',
  rate_limited: 'Слишком много проверок подряд. Подождите немного и попробуйте снова.',
  session_expired: 'Сессия истекла — войдите в Claude заново.',
  refused: 'Claude не смог проверить этот текст. Попробуйте изменить его.',
  invalid_json: 'Ответ пришёл в неожиданном виде. Нажмите «Проверить» ещё раз.',
  prompt_too_large: 'Текст слишком длинный. Проверяйте по частям.',
};
const HIDE_CODES = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];

function CheckerView() {
  const [text, setText] = useState(CHECK_SAMPLE);
  const [sample, setSample] = useState(undefined); // undefined: ждём, null: нет Claude
  const [status, setStatus] = useState('idle');
  const [result, setResult] = useState(null);
  const [checked, setChecked] = useState('');
  const [note, setNote] = useState('');
  const [active, setActive] = useState(null);
  const [ctl, setCtl] = useState(null);
  const [tr, setTr] = useState(null); // {status: 'loading'|'done'|'error', text, source, note}
  const trCtl = React.useRef(null);
  const areaRef = React.useRef(null);

  // Поле растёт вместе с текстом
  React.useLayoutEffect(() => {
    const el = areaRef.current;
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.max(el.scrollHeight + 4, 120) + 'px';
  }, [text]);
  useEffect(() => {
    const onResize = () => { const el = areaRef.current; if (el) { el.style.height = 'auto'; el.style.height = Math.max(el.scrollHeight + 4, 120) + 'px'; } };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  const translate = async (src) => {
    if (trCtl.current) trCtl.current.abort();
    const c = new AbortController(); trCtl.current = c;
    setTr({ status: 'loading' });
    try {
      const t = await translateMyMemory(src, c.signal);
      if (!c.signal.aborted) setTr({ status: 'done', text: t, source: 'mymemory' });
    } catch (e) {
      if (isAbort(e)) return;
      setTr({ status: 'error', note: e && e.code === 'quota'
        ? 'Дневной лимит бесплатного перевода закончился. Перевод снова будет доступен завтра.'
        : 'Не удалось получить перевод: нет интернета или сервис перевода занят.' });
    }
  };

  useEffect(() => {
    let alive = true;
    if (!window.claude || typeof window.claude.use !== 'function') { setSample(null); return; }
    window.claude.use('sample').then((s) => { if (alive) setSample(s || null); }).catch(() => alive && setSample(null));
    return () => { alive = false; };
  }, []);

  const runOffline = (src, why) => {
    const errors = offlineCheck(src);
    let corrected = src;
    [...errors].sort((a, b) => b.index - a.index).forEach((e) => { corrected = corrected.slice(0, e.index) + e.correct + corrected.slice(e.index + e.wrong.length); });
    setResult({ errors, corrected, summary: errors.length ? 'Простая проверка нашла типичные ошибки. Она знает не все правила.' : 'Простая проверка ошибок не нашла, но она знает только базовые правила.', engine: 'offline' });
    setNote(why || '');
    setStatus('done');
    translate(corrected || src);
  };

  const check = async () => {
    const src = text.trim();
    if (!src) return;
    setChecked(src); setActive(null); setNote(''); setResult(null); setTr(null);
    if (trCtl.current) trCtl.current.abort();
    const c = new AbortController(); setCtl(c);
    setStatus('loading');
    try {
      if (sample) {
        try {
          const data = await sample.json(buildCheckPrompt(src), { signal: c.signal });
          const errors = Array.isArray(data && data.errors) ? data.errors.filter((e) => e && e.wrong) : [];
          setResult({ errors, corrected: String((data && data.corrected) || src), summary: String((data && data.summary) || ''), engine: 'claude' });
          if (data && data.translation) setTr({ status: 'done', text: String(data.translation), source: 'claude' });
          setStatus('done');
          return;
        } catch (e) {
          const code = e && e.code;
          if (code === 'cancelled') { setStatus('idle'); return; }
          if (HIDE_CODES.includes(code)) setSample(null);
          else { setNote(SAMPLE_ERRORS[code] || 'Не удалось связаться с Claude. Попробуйте ещё раз.'); setStatus('error'); return; }
        }
      }
      try {
        const lt = await languageToolCheck(src, c.signal);
        const n = lt.errors.length;
        setResult({ ...lt, engine: 'lt', summary: n ? 'Нажмите на ошибку, чтобы увидеть объяснение и варианты исправления.' : 'Отлично! LanguageTool не нашёл ошибок в этом тексте.' });
        setStatus('done');
        translate(lt.corrected || src);
      } catch (e) {
        if (e && e.name === 'AbortError') { setStatus('idle'); return; }
        runOffline(src, e && e.code === 'lt_rate'
          ? 'Слишком много проверок за минуту. Пока работает простая проверка, через минуту снова будет доступна полная.'
          : 'Не удалось подключиться к базе правил LanguageTool (нет интернета или сервис занят). Включена простая проверка.');
      }
    } finally { setCtl(null); }
  };

  const parts = result ? locateErrors(checked, result.errors) : [];
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;

  return (
    <div className="fade-in space-y-6">
      <SectionTitle eyebrow="Тренажёр" title="Проверка текста">Напишите несколько предложений по-английски. Тренажёр найдёт ошибки, подсветит их и объяснит каждое правило по-русски.</SectionTitle>

      <Panel>
        <label htmlFor="check-text" className="text-sm text-muted">Ваш текст на английском</label>
        <textarea id="check-text" ref={areaRef} value={text} onChange={(e) => setText(e.target.value)} rows={4} maxLength={3000}
          placeholder="Например: My sister like music and she play the guitar."
          className="mt-2 w-full rounded-xl border-2 border-line bg-surface2 p-3 text-base leading-relaxed outline-none transition-colors duration-200 focus:border-indigo resize-none overflow-hidden" style={{ minHeight: 120, transition: 'height .15s ease, border-color .2s' }} />
        <div className="mt-3 flex flex-wrap items-center gap-3">
          {status === 'loading' ? (
            <button onClick={() => ctl && ctl.abort()} className="inline-flex items-center gap-2 border-2 border-line px-5 py-2.5 rounded-xl font-medium transition-colors hover:border-red">
              <Square size={16} /> Остановить
            </button>
          ) : (
            <button onClick={check} disabled={!text.trim()} className="inline-flex items-center gap-2 bg-indigo text-surface px-5 py-2.5 rounded-xl font-medium transition-transform duration-200 hover:-translate-y-0.5 disabled:opacity-50 disabled:hover:translate-y-0">
              <SpellCheck size={18} /> Проверить
            </button>
          )}
          <button onClick={() => { setText(''); setResult(null); setNote(''); setTr(null); }} className="text-sm text-muted hover:text-ink transition-colors">Очистить</button>
          <button onClick={() => setText(CHECK_SAMPLE)} className="text-sm text-muted hover:text-ink transition-colors">Пример с ошибками</button>
          <span className="text-xs text-muted ml-auto tnum">{words} слов · {text.length}/3000</span>
        </div>
        <p className="text-xs text-muted mt-3 flex items-center gap-1.5 flex-wrap">
          <Sparkles size={13} className="text-indigo" />
          {sample === undefined ? 'Подключаем проверку…' : sample
            ? 'Проверяет Claude. При первой проверке страница попросит разрешение.'
            : <span>Проверяет база правил <a href="https://languagetool.org" target="_blank" rel="noopener" className="text-indigo underline">LanguageTool</a>. Без интернета работает простая проверка.</span>}
        </p>
      </Panel>

      {status === 'loading' && (
        <Panel className="fade-in flex items-center gap-3 text-muted">
          <Loader2 size={20} className="animate-spin text-indigo" /> {sample ? 'Claude читает ваш текст и ищет ошибки… Обычно это занимает до минуты.' : 'Сверяем текст с базой правил LanguageTool…'}
        </Panel>
      )}

      {note && (
        <div className="fade-in flex gap-2 items-start rounded-xl px-4 py-3 text-sm bg-amberSoft">
          <AlertTriangle size={17} className="text-amber shrink-0 mt-0.5" /> <span>{note}</span>
        </div>
      )}

      {status === 'done' && result && (
        <div className="fade-in space-y-6">
          <Panel>
            <div className="flex flex-wrap items-baseline justify-between gap-2">
              <h3 className="font-display text-xl font-semibold">Результат</h3>
              <span className={`text-sm font-medium px-3 py-1 rounded-full tnum ${result.errors.length ? 'bg-redSoft text-red' : 'bg-greenSoft text-green'}`}>
                {result.errors.length ? `Ошибок: ${result.errors.length}` : 'Ошибок нет'}
              </span>
            </div>
            {result.summary && <p className="text-muted mt-1">{result.summary}</p>}
            <p className="text-xs text-muted mt-2">
              Проверено: {result.engine === 'claude' ? 'Claude' : result.engine === 'lt'
                ? <a href="https://languagetool.org" target="_blank" rel="noopener" className="text-indigo underline">LanguageTool</a>
                : 'простая проверка базовых правил'}
            </p>
            <p className="mt-4 text-lg leading-loose break-words">
              {parts.map((p, k) => p.i === undefined ? <span key={k}>{p.t}</span> : (
                <button key={k} onClick={() => setActive(p.i === active ? null : p.i)}
                  className={`rounded px-0.5 underline decoration-wavy decoration-red underline-offset-4 transition-colors duration-200 ${active === p.i ? 'bg-redSoft' : 'hover:bg-redSoft'}`}>
                  {p.t}<sup className="text-xs text-red font-semibold ml-0.5 no-underline">{p.i + 1}</sup>
                </button>
              ))}
            </p>
          </Panel>

          {result.errors.length > 0 && (
            <Panel>
              <h3 className="font-display text-xl font-semibold">Разбор ошибок</h3>
              <ol className="mt-4 space-y-3">
                {result.errors.map((e, i) => (
                  <li key={i}>
                    <button onClick={() => setActive(i === active ? null : i)}

                      <span className="w-7 h-7 shrink-0 rounded-full bg-redSoft text-red flex items-center justify-center text-sm font-semibold tnum">{i + 1}</span>

                        </span>
                        <span className="block text-sm mt-1">{e.explain}</span>
                        {e.original && <span className="block text-sm text-muted mt-1" lang="en">{e.original}</span>}

                      </span>

                  </span>
                )}
              </div>
              {tr.status === 'loading' && <p className="mt-3 text-muted flex items-center gap-2"><Loader2 size={17} className="animate-spin text-indigo" /> Переводим…</p>}
              {tr.status === 'done' && <p className="mt-3 text-lg leading-relaxed bg-blueSoft rounded-xl p-4 break-words" lang="ru">{tr.text}</p>}
              {tr.status === 'error' && <p className="mt-3 text-sm text-muted">{tr.note}</p>}
              {tr.status === 'done' && result.errors.length > 0 && <p className="text-xs text-muted mt-2">Переведён исправленный вариант текста.</p>}
            </Panel>
          )}

          {result.errors.length > 0 && (

function editDistance(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 2) return 9;
  const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
  }
  return d[m][n];
}

function stems(w) {
  const out = [w];
  const rules = [[/ies$/, 'y'], [/ied$/, 'y'], [/'s$/, ''], [/s'$/, ''], [/es$/, ''], [/s$/, ''], [/ed$/, ''], [/ed$/, 'e'], [/ing$/, ''], [/ing$/, 'e'], [/er$/, ''], [/est$/, ''], [/ly$/, '']];
  rules.forEach(([re, rep]) => { if (re.test(w)) { const s = w.replace(re, rep); out.push(s); if (/(.)\1$/.test(s)) out.push(s.slice(0, -1)); } });
  return out;
}

function keepCase(orig, sug) {
  if (/^[A-Z]/.test(orig) && /^[a-z]/.test(sug)) return sug.charAt(0).toUpperCase() + sug.slice(1);
  return sug;
}

function offlineSpell(word) {
  const lw = word.toLowerCase().replace(/’/g, "'");
  if (MISSPELL[lw]) return { ok: false, sure: true, suggestions: [keepCase(word, MISSPELL[lw])] };
  if (stems(lw).some((s) => KNOWN.has(s))) return { ok: true };
  if (lw.length <= 4) return { ok: true, unknown: true };
  const limit = lw.length <= 5 ? 1 : 2;
  const cands = [];
  for (const k of KNOWN_LIST) {
    if (Math.abs(k.length - lw.length) > limit) continue;
    const dist = editDistance(lw, k);
    if (dist <= limit) cands.push([dist, Math.abs(k.length - lw.length), k]);
  }
  cands.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (cands.length) return { ok: false, sure: false, suggestions: cands.slice(0, 3).map((c) => keepCase(word, c[2])) };
  return { ok: true, unknown: true };
}

function tokenize(str) {
  const out = [];
  const re = /[A-Za-z]+(?:['’][A-Za-z]+)*/g;
  let m;
  while ((m = re.exec(str))) out.push({ text: m[0], start: m.index, end: m.index + m[0].length });
  return out;
}

function offlineAnalyze(input) {
  const tokens = tokenize(input).map((t) => ({ ...t, ...offlineSpell(t.text), source: 'builtin' }));
  const corrected = applyFixes(input, tokens);
  const words = tokenize(corrected).map((t) => t.text.toLowerCase());
  const entries = words.map((w) => DICT[w] || null);
  const allKnown = words.length > 0 && entries.every(Boolean);
  return {
    input, tokens, corrected,
    ipaUS: allKnown ? '/' + entries.map((e) => e.us).join(' ') + '/' : '',
    ipaUK: allKnown ? '/' + entries.map((e) => e.uk).join(' ') + '/' : '',
    ru: words.length === 1 && entries[0] ? entries[0].ru : '',
    source: 'builtin',
  };
}

function applyFixes(input, tokens) {
  let out = input;
  [...tokens].reverse().forEach((t) => { if (!t.ok && t.sure && t.suggestions && t.suggestions[0]) out = out.slice(0, t.start) + t.suggestions[0] + out.slice(t.end); });
  return out;
}

function buildPronouncePrompt(input) {
  return [

    'Reply with ONLY a JSON object:',
    '{"tokens":[{"text":"each word exactly as typed","ok":true,"suggestions":[]}],"corrected":"the phrase with spelling fixed","ipa_us":"/General American IPA of the corrected phrase/","ipa_uk":"/British RP IPA of the corrected phrase/","ru":"short Russian translation","pos":"part of speech in Russian, or empty","tip":"one short tip in Russian about sounds in this word that Russian speakers often get wrong, or empty"}',
    'Set ok:false only for misspelled or non-existent words and give up to 3 suggestions, best first. Names and correct words are ok:true with empty suggestions.',
    '',
