}

/* Вне Claude: словарь dictionaryapi.dev (транскрипция и записи носителей) + LanguageTool (орфография) */
async function fetchDictionary(word, signal) {
  const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.toLowerCase()), { signal });
  if (res.status === 404) return { found: false };
  if (!res.ok) throw new Error('dict ' + res.status);
  const data = await res.json();
  const entry = Array.isArray(data) ? data[0] : null;
  if (!entry) return { found: false };
  const ph = (Array.isArray(data) ? data : []).flatMap((e) => e.phonetics || []);
  const byAudio = (re) => ph.find((p) => p.text && p.audio && re.test(p.audio));
  const anyText = (entry.phonetic) || (ph.find((p) => p.text) || {}).text || '';
  const audioUS = (ph.find((p) => p.audio && /-us\.mp3$/.test(p.audio)) || {}).audio || '';
  const audioUK = (ph.find((p) => p.audio && /-uk\.mp3$/.test(p.audio)) || {}).audio || '';
  const meaning = entry.meanings && entry.meanings[0];
  return {
    found: true,
    us: ((byAudio(/-us\.mp3$/) || {}).text) || anyText,
    uk: ((byAudio(/-uk\.mp3$/) || {}).text) || anyText,
    audioUS, audioUK,
    pos: meaning ? meaning.partOfSpeech : '',
    def: meaning && meaning.definitions && meaning.definitions[0] ? meaning.definitions[0].definition : '',
  };
}

const stripSlashes = (s) => String(s || '').replace(/^[\/\[]|[\/\]]$/g, '').trim();
const POS_RU = { noun: 'существительное', verb: 'глагол', adjective: 'прилагательное', adverb: 'наречие', pronoun: 'местоимение', preposition: 'предлог', conjunction: 'союз', interjection: 'междометие', exclamation: 'восклицание' };
const isAbort = (e) => e && e.name === 'AbortError';

/* Викисловарь (en.wiktionary.org): транскрипции почти всех слов, с пометками US / UK */
const WIKI_US = /^(US|GA|GenAm|General American|American|Canada|CA|North American|NAmE)$/i;
const WIKI_UK = /^(UK|RP|Received Pronunciation|British|SSB|Southern England|England|BrE)$/i;
function parseWiktionaryIPA(content) {
  const start = content.search(/^==\s*English\s*==\s*$/m);
  if (start < 0) return null;
  const rest = content.slice(start + 5);
  const next = rest.search(/^==[^=].*==\s*$/m);
  const section = next >= 0 ? rest.slice(0, next) : rest;
  let us = '', uk = '', any = '';
  section.split('\n').forEach((line) => {
    const tpl = line.match(/\{\{IPA\|en\|([^}]*)\}\}/);
    if (!tpl) return;
    const args = tpl[1].split('|');
    const prons = args.filter((a) => /^[\/\[]/.test(a.trim())).map((a) => a.trim());
    const phonemic = prons.find((p) => p.startsWith('/')) || prons[0];
    if (!phonemic) return;
    const labels = [];
    (line.match(/\{\{(?:a|accent|lb)\|([^}]*)\}\}/g) || []).forEach((m) => m.replace(/^\{\{\w+\|/, '').replace(/\}\}$/, '').split('|').forEach((x) => labels.push(x.trim())));
    args.filter((a) => /^(a|aa|q|qq)\d*=/.test(a)).forEach((a) => a.split('=')[1].split(/[,;]/).forEach((x) => labels.push(x.trim())));
    const isUS = labels.some((l) => WIKI_US.test(l));
    const isUK = labels.some((l) => WIKI_UK.test(l));
    if (isUS && !us) us = phonemic;
    if (isUK && !uk) uk = phonemic;
    if (!isUS && !isUK && !any) any = phonemic;
  });
  if (!us && !uk && !any) return null;
  return { us: stripSlashes(us || any || uk), uk: stripSlashes(uk || any || us) };
}
async function fetchWiktionary(word, signal) {
  const variants = [word.toLowerCase()];
  if (word !== word.toLowerCase()) variants.push(word);
  else variants.push(word.charAt(0).toUpperCase() + word.slice(1));
  for (const v of variants) {
    const url = 'https://en.wiktionary.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&format=json&formatversion=2&redirects=1&origin=*&titles=' + encodeURIComponent(v);
    const res = await fetch(url, { signal });
    if (!res.ok) throw new Error('wiki ' + res.status);
    const data = await res.json();
    const page = data && data.query && data.query.pages && data.query.pages[0];
    const content = page && !page.missing && page.revisions && page.revisions[0] && page.revisions[0].slots && page.revisions[0].slots.main.content;
    if (content) { const ipa = parseWiktionaryIPA(content); if (ipa) return ipa; }
  }
  return null;
}

/* Datamuse (основан на словаре произношений CMU): американская транскрипция и исправление опечаток */
async function fetchDatamuseIPA(word, signal) {
  const res = await fetch('https://api.datamuse.com/words?md=r&ipa=1&max=1&sp=' + encodeURIComponent(word.toLowerCase()), { signal });
  if (!res.ok) throw new Error('datamuse ' + res.status);
  const data = await res.json();
  const hit = Array.isArray(data) ? data[0] : null;
  if (!hit || String(hit.word).toLowerCase() !== word.toLowerCase()) return null;
  const tag = (hit.tags || []).find((t) => /^(ipa_pron|pron):/.test(t));
  if (!tag || !tag.startsWith('ipa_pron:')) return null;
  return tag.slice(9).trim();
}
async function fetchDatamuseSuggestions(word, signal) {
  const res = await fetch('https://api.datamuse.com/sug?max=4&s=' + encodeURIComponent(word.toLowerCase()), { signal });
  if (!res.ok) throw new Error('datamuse ' + res.status);
  const data = await res.json();
  return (Array.isArray(data) ? data : []).map((d) => String(d.word)).filter((w) => /^[a-z' -]+$/i.test(w) && w.toLowerCase() !== word.toLowerCase()).slice(0, 3);
}

/* MyMemory: бесплатный машинный перевод англ. → рус. (до 500 байт за запрос, есть дневной лимит) */
function splitForTranslation(text, max = 450) {
  const sentences = text.match(/[^.!?\n]+[.!?]*\s*/g) || [text];
  const chunks = []; let cur = '';
  const bytes = (s) => new TextEncoder().encode(s).length;
  sentences.forEach((s) => {
    if (bytes(cur + s) <= max) { cur += s; return; }
    if (cur) chunks.push(cur);
    if (bytes(s) <= max) { cur = s; return; }
    let piece = '';
    s.split(/(\s+)/).forEach((w) => { if (bytes(piece + w) > max) { if (piece) chunks.push(piece); piece = w; } else piece += w; });
    cur = piece;
  });
  if (cur.trim()) chunks.push(cur);
  return chunks.map((c) => c.trim()).filter(Boolean);
}
async function translateMyMemory(text, signal) {
  const out = [];
  for (const chunk of splitForTranslation(text)) {
    const res = await fetch('https://api.mymemory.translated.net/get?langpair=en|ru&q=' + encodeURIComponent(chunk), { signal });
    if (!res.ok) { const e = new Error('mymemory ' + res.status); e.code = res.status === 429 ? 'quota' : 'http'; throw e; }
    const data = await res.json();
    const t = data && data.responseData && data.responseData.translatedText;
    const status = Number(data && data.responseStatus);
    if (status === 429 || /MYMEMORY WARNING|USED ALL AVAILABLE FREE/i.test(String(t))) { const e = new Error('quota'); e.code = 'quota'; throw e; }
    if (status !== 200 || !t) throw new Error('mymemory status ' + status);
    out.push(t);
  }
  return out.join(' ');
}

async function webAnalyze(input, signal) {
  const base = offlineAnalyze(input);
  let tokens = base.tokens;
  let spellSource = 'builtin';
  try {
    const body = new URLSearchParams({ text: input, language: 'en-US' });
    const res = await fetch(LT_URL, { method: 'POST', body, signal, headers: { Accept: 'application/json' } });
    if (res.ok) {
      const data = await res.json();
      const typos = (data.matches || []).filter((m) => (m.rule && (m.rule.issueType === 'misspelling' || (m.rule.category && m.rule.category.id === 'TYPOS'))));
      tokens = tokenize(input).map((t) => {
        const m = typos.find((x) => x.offset < t.end && x.offset + x.length > t.start);
        if (m) return { ...t, ok: false, sure: true, suggestions: (m.replacements || []).slice(0, 3).map((r) => r.value), source: 'lt' };
        const own = base.tokens.find((b) => b.start === t.start);
        return { ...t, ok: true, source: 'lt', unknown: !!(own && own.unknown) };
      });
      spellSource = 'lt';
    }
  } catch (e) { if (isAbort(e)) throw e; }

  const corrected = applyFixes(input, tokens);
  const words = tokenize(corrected).map((t) => t.text).slice(0, 6);
  const safe = (p) => p.catch((e) => { if (isAbort(e)) throw e; return null; });
  const [dicts, wikis] = await Promise.all([
    Promise.all(words.map((w) => safe(fetchDictionary(w, signal)))),
    Promise.all(words.map((w) => safe(fetchWiktionary(w, signal)))),
  ]);
  const sources = new Set();
  const per = await Promise.all(words.map(async (w, i) => {
    const d = dicts[i], wk = wikis[i], b = DICT[w.toLowerCase()];
    if (wk) { sources.add('wiktionary'); return { us: wk.us, uk: wk.uk }; }
    if (d && d.found && (d.us || d.uk)) { sources.add('web'); return { us: stripSlashes(d.us || d.uk), uk: stripSlashes(d.uk || d.us) }; }
    if (b) { sources.add('builtin'); return { us: b.us, uk: b.uk }; }
    const dm = await safe(fetchDatamuseIPA(w, signal));
    if (dm) { sources.add('datamuse'); return { us: dm, uk: '' }; }
    return null;
  }));
  // Слово не нашлось ни в одном словаре — пометим как подозрительное; варианты без подсказок спросим у Datamuse
  tokens = await Promise.all(tokens.map(async (t) => {
    const i = words.findIndex((w) => w.toLowerCase() === t.text.toLowerCase());
    const nowhere = t.ok && t.unknown && i >= 0 && !per[i] && !wikis[i] && !(dicts[i] && dicts[i].found);
    const needs = nowhere || (!t.ok && (!t.suggestions || !t.suggestions.length));
    if (!needs) return t;
    let sug = [];
    try { sug = (await fetchDatamuseSuggestions(t.text, signal)).map((x) => keepCase(t.text, x)); } catch (e) { if (isAbort(e)) throw e; }
    if (nowhere) return { ...t, ok: false, sure: false, suggestions: sug, source: sug.length ? 'datamuse' : t.source };
    return sug.length ? { ...t, suggestions: sug, source: 'datamuse' } : t;
  }));
  const unknownWords = tokens.some((t) => !t.ok);

  const full = words.length > 0 && per.every(Boolean);
  const single = words.length === 1 ? dicts[0] : null;
  const entry = words.length === 1 ? DICT[words[0].toLowerCase()] : null;
  let ru = entry ? entry.ru : '';
  let ruSource = entry ? 'builtin' : '';
  if (!ru && words.length && !unknownWords) {
    try { ru = await translateMyMemory(words.join(' '), signal); ruSource = 'mymemory'; } catch (e) { if (isAbort(e)) throw e; }
  }
  return {
    input, tokens, corrected,
    ipaUS: full ? '/' + per.map((p) => p.us).join(' ') + '/' : '',
    ipaUK: full && per.every((p) => p.uk) ? '/' + per.map((p) => p.uk).join(' ') + '/' : '',
    ru, ruSource,
    pos: single && single.found ? (POS_RU[single.pos] || single.pos) : '',
    def: single && single.found ? single.def : '',
    audioUS: single && single.found ? single.audioUS : '',
    audioUK: single && single.found ? single.audioUK : '',
    source: sources.size ? [...sources].join('+') : 'builtin',
    spellSource,
  };
}

function claudeToAnalysis(input, data) {
  const typed = tokenize(input);
  const got = Array.isArray(data && data.tokens) ? data.tokens : [];
  let from = 0;
  const tokens = typed.map((t) => {
    let idx = -1;
    for (let k = from; k < got.length; k++) if (String(got[k].text || '').toLowerCase() === t.text.toLowerCase()) { idx = k; break; }
    if (idx < 0) return { ...t, ok: true, source: 'claude' };
    from = idx + 1;
    const g = got[idx];
    const sugg = Array.isArray(g.suggestions) ? g.suggestions.map(String).filter(Boolean).slice(0, 3) : [];
    return { ...t, ok: g.ok !== false, sure: true, suggestions: sugg, source: 'claude' };
  });
  const wrap = (s) => { const x = stripSlashes(s); return x ? '/' + x + '/' : ''; };
  return {
    input, tokens,
    corrected: String((data && data.corrected) || applyFixes(input, tokens)),
    ipaUS: wrap(data && data.ipa_us), ipaUK: wrap(data && data.ipa_uk),
    ru: String((data && data.ru) || ''), pos: String((data && data.pos) || ''), tip: String((data && data.tip) || ''),
    source: 'claude', spellSource: 'claude',
  };
}

/* Слово с подсказкой при наведении, как в Word */
function SpellToken({ t, onPick }) {
  if (t.ok) return <span>{t.text}</span>;
  const color = t.sure ? 'decoration-red' : 'decoration-amber';
  return (
    <span className="relative inline-block group">
      <button type="button" className={`underline decoration-wavy ${color} underline-offset-[5px] decoration-2 rounded px-0.5 transition-colors duration-200 hover:bg-redSoft focus:bg-redSoft outline-none`}
        aria-label={`${t.text}: возможно, ошибка. ${t.suggestions && t.suggestions.length ? 'Варианты: ' + t.suggestions.join(', ') : ''}`}>
        {t.text}
      </button>
      <span role="tooltip"
        className="pointer-events-none group-hover:pointer-events-auto group-focus-within:pointer-events-auto opacity-0 translate-y-1 group-hover:opacity-100 group-hover:translate-y-0 group-focus-within:opacity-100 group-focus-within:translate-y-0 transition-all duration-200 absolute left-0 top-full z-20 pt-2 w-max max-w-[260px]">
        <span className="block bg-surface border border-line rounded-xl shadow-lg p-3 text-sm text-left whitespace-normal">
          <span className="block text-xs text-muted mb-1.5">{t.sure ? 'Ошибка в написании. Правильно:' : (t.suggestions && t.suggestions.length ? 'Слова нет в словаре. Возможно, вы имели в виду:' : 'Такого слова нет в словаре. Проверьте написание.')}</span>
          {t.suggestions && t.suggestions.length > 0 && (
            <span className="flex flex-wrap gap-1.5">
              {t.suggestions.map((s) => (
                <button key={s} type="button" onClick={() => onPick(t, s)}
                  className="px-2.5 py-1 rounded-lg bg-greenSoft text-green font-semibold transition-transform duration-150 hover:-translate-y-0.5">{s}</button>
              ))}
            </span>
          )}
        </span>
      </span>
    </span>
  );
}

const SAY_EXAMPLES = ['thought', 'comfortable', 'vegetable', 'Wednesday', 'through', 'world', 'island', 'answer'];
const SPEEDS = [{ v: 0.6, l: 'Медленно' }, { v: 0.85, l: 'Спокойно' }, { v: 1, l: 'Обычно' }];
const SOURCES = {
  claude: { label: 'Claude' },
  wiktionary: { label: 'Викисловарь (Wiktionary)', url: 'https://en.wiktionary.org' },
  web: { label: 'Free Dictionary API', url: 'https://dictionaryapi.dev' },
  datamuse: { label: 'Datamuse / CMU', url: 'https://www.datamuse.com/api/' },
  builtin: { label: 'встроенный словарь приложения' },
};

function PronounceView() {
  const supported = typeof window !== 'undefined' && 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
  const [word, setWord] = useState('beatiful');
  const [accent, setAccent] = useState('en-US');
  const [rate, setRate] = useState(0.85);
  const [voices, setVoices] = useState([]);
  const [speaking, setSpeaking] = useState(null);
  const [history, setHistory] = useState([]);
  const [err, setErr] = useState('');
  const [sample, setSample] = useState(undefined);
  const [analysis, setAnalysis] = useState(null);
  const [loading, setLoading] = useState(false);
  const [lookupNote, setLookupNote] = useState('');
  const ctlRef = React.useRef(null);
  const audioRef = React.useRef(null);

  useEffect(() => {
    let alive = true;
    if (!window.claude || typeof window.claude.use !== 'function') setSample(null);
    else window.claude.use('sample').then((s) => alive && setSample(s || null)).catch(() => alive && setSample(null));
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    if (!supported) return;
    const load = () => setVoices(window.speechSynthesis.getVoices().filter((v) => /^en[-_]/i.test(v.lang)));
    load();
    window.speechSynthesis.addEventListener('voiceschanged', load);
    return () => { window.speechSynthesis.removeEventListener('voiceschanged', load); window.speechSynthesis.cancel(); };
  }, []);

  // Проверка написания по встроенному словарю — сразу, пока печатаете
  const live = useMemo(() => offlineAnalyze(word), [word]);
  const view = analysis && analysis.input === word ? analysis : live;
  const wrongCount = view.tokens.filter((t) => !t.ok).length;

  const pickVoice = (lang) => {
    const norm = (l) => l.replace('_', '-').toLowerCase();
    const exact = voices.filter((v) => norm(v.lang) === lang.toLowerCase());
    const pref = exact.find((v) => /natural|premium|enhanced|google|samantha|daniel/i.test(v.name));
    return pref || exact[0] || voices[0] || null;
  };

  const speak = (w, opts = {}) => {
    const clean = String(w || '').trim().slice(0, 200);
    if (!clean || !supported) return;
    const lang = opts.lang || accent;
    const id = opts.id || 'main';
    setErr('');
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = lang;
    const v = pickVoice(lang);
    if (v) u.voice = v;
    u.rate = opts.rate || rate;
    u.onstart = () => setSpeaking(id);
    u.onend = () => setSpeaking(null);
    u.onerror = (e) => { setSpeaking(null); if (e.error !== 'interrupted' && e.error !== 'canceled') setErr('Браузер не смог воспроизвести звук. Проверьте громкость или попробуйте другой браузер.'); };
    window.speechSynthesis.speak(u);
  };

  const playRecording = (url, id) => {
    try {
      if (audioRef.current) audioRef.current.pause();
      const a = new Audio(url);
      audioRef.current = a;
      a.onplay = () => setSpeaking(id);
      a.onended = () => setSpeaking(null);
      a.onerror = () => { setSpeaking(null); setErr('Запись не загрузилась. Послушайте синтезированный голос.'); };
      a.play().catch(() => { setSpeaking(null); setErr('Запись не загрузилась. Послушайте синтезированный голос.'); });
    } catch (e) { setErr('Запись не загрузилась.'); }
  };

  const lookup = async (input) => {
    const src = input.trim();
    if (!src) return;
    if (ctlRef.current) ctlRef.current.abort();
    const c = new AbortController();
    ctlRef.current = c;
    setLoading(true); setLookupNote('');
    try {
      let res = null;
      if (sample) {
        try {
          const data = await sample.json(buildPronouncePrompt(src), { signal: c.signal, modelTier: 'quick' });
          res = claudeToAnalysis(src, data);
        } catch (e) {
          if (e && e.code === 'cancelled') return;
          if (HIDE_CODES.includes(e && e.code)) setSample(null);
          else setLookupNote(SAMPLE_ERRORS[e && e.code] || 'Claude сейчас недоступен — показываем данные встроенного словаря.');
        }
      }
      if (!res) {
        try { res = await webAnalyze(src, c.signal); }
        catch (e) { if (e && e.name === 'AbortError') return; res = offlineAnalyze(src); }
      }
      if (!c.signal.aborted) setAnalysis({ ...res, input });
    } finally {
      if (ctlRef.current === c) { setLoading(false); ctlRef.current = null; }
    }
  };

  const submit = (w) => {
    const value = w !== undefined ? w : word;
    if (!value.trim()) return;
    if (w !== undefined) setWord(w);
    speak(value, { id: w !== undefined ? 'ex:' + w : 'main' });
    lookup(value);
    setHistory((h) => [value.trim(), ...h.filter((x) => x.toLowerCase() !== value.trim().toLowerCase())].slice(0, 8));
  };

  const pick = (t, s) => {
    const next = word.slice(0, t.start) + s + word.slice(t.end);
    setWord(next);
    submit(next);
  };

  const onSubmit = (e) => { e.preventDefault(); submit(); };
  const hasAccent = (lang) => voices.some((v) => v.lang.replace('_', '-').toLowerCase() === lang.toLowerCase());
  const isFresh = analysis && analysis.input === word;
  const corrected = view.corrected && view.corrected !== word ? view.corrected : '';

  return (
    <div className="fade-in space-y-6">
      <SectionTitle eyebrow="Тренажёр" title="Произношение">Введите слово или короткую фразу: приложение проверит написание, покажет транскрипцию и озвучит американский или британский вариант.</SectionTitle>

      {!supported && (
        <div className="flex gap-2 items-start rounded-xl px-4 py-3 text-sm bg-amberSoft">
          <AlertTriangle size={17} className="text-amber shrink-0 mt-0.5" /> Этот браузер не умеет озвучивать текст. Транскрипция и проверка написания работают, а для звука откройте страницу в Chrome, Edge или Safari.
        </div>
      )}

      <Panel>
        <form onSubmit={onSubmit} className="flex flex-col sm:flex-row gap-3">
          <label htmlFor="say-word" className="sr-only">Слово для произношения</label>
          <input id="say-word" value={word} onChange={(e) => setWord(e.target.value)} maxLength={200} autoComplete="off" spellCheck="false" lang="en"
            placeholder="Например: comfortable"
            className={`flex-1 min-w-0 rounded-xl border-2 bg-surface2 px-4 py-3 text-xl outline-none transition-colors duration-200 focus:border-indigo ${wrongCount ? 'border-red' : 'border-line'}`} />
          <button type="submit" disabled={!word.trim()}
            className={`inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-medium text-surface transition-all duration-200 disabled:opacity-50 ${speaking === 'main' ? 'bg-green scale-105' : 'bg-indigo hover:-translate-y-0.5'}`}>
            <Volume2 size={20} className={speaking === 'main' ? 'animate-pulse' : ''} /> {speaking === 'main' ? 'Звучит…' : 'Послушать'}
          </button>
        </form>

        {word.trim() && (
          <div className="mt-4 rounded-xl bg-surface2 border border-line px-4 py-3">
            <div className="flex flex-wrap items-center gap-x-3 gap-y-1 justify-between">
              <p className="text-xs uppercase tracking-wider text-muted">Проверка написания</p>
              <p className={`text-xs font-medium ${wrongCount ? 'text-red' : 'text-green'}`}>
                {wrongCount ? `Возможные ошибки: ${wrongCount} — наведите на подчёркнутое слово` : 'Ошибок не найдено'}
              </p>
            </div>
            <p className="mt-2 text-xl leading-relaxed break-words" lang="en">
              {(() => {
                const out = []; let pos = 0;
                view.tokens.forEach((t, k) => {
                  if (t.start > pos) out.push(<span key={'g' + k}>{word.slice(pos, t.start)}</span>);
                  out.push(<SpellToken key={k + t.text} t={t} onPick={pick} />);
                  pos = t.end;
                });
                if (pos < word.length) out.push(<span key="tail">{word.slice(pos)}</span>);
                return out;
              })()}
            </p>
            {corrected && (
              <div className="mt-2 flex flex-wrap items-center gap-2 text-sm">
                <span className="text-muted">Рекомендуем написать:</span>
                <button type="button" onClick={() => { setWord(corrected); submit(corrected); }} className="font-semibold text-green hover:underline">{corrected}</button>
              </div>
            )}
            <p className="text-xs text-muted mt-2">
              {loading ? 'Уточняем…' : isFresh
                ? `Проверено: ${analysis.spellSource === 'claude' ? 'Claude' : analysis.spellSource === 'lt' ? 'LanguageTool' : 'встроенный словарь'}`
                : 'Пока вы печатаете, проверяет встроенный словарь. Нажмите «Послушать» для полной проверки.'}
            </p>
          </div>
        )}

        <div className="grid gap-5 sm:grid-cols-2 mt-5">
          <div>
            <p className="text-sm text-muted mb-2">Акцент</p>
            <div className="inline-flex bg-surface2 rounded-xl p-1 border border-line">
              {[['en-US', 'Американский', 'us'], ['en-GB', 'Британский', 'gb']].map(([k, l, f]) => (
                <button key={k} type="button" onClick={() => setAccent(k)} className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm transition-all duration-200 ${accent === k ? 'bg-surface shadow-sm font-medium text-indigo' : 'text-muted'}`}>
                  <Flag code={f} className="w-5 h-3.5" /> {l}{voices.length > 0 && !hasAccent(k) && <span className="text-xs">*</span>}
                </button>
              ))}
            </div>
          </div>
          <div>
            <p className="text-sm text-muted mb-2">Скорость</p>
            <div className="inline-flex bg-surface2 rounded-xl p-1 border border-line">
              {SPEEDS.map((s) => (
                <button key={s.v} type="button" onClick={() => setRate(s.v)} className={`px-3 py-1.5 rounded-lg text-sm transition-all duration-200 ${rate === s.v ? 'bg-surface shadow-sm font-medium text-indigo' : 'text-muted'}`}>{s.l}</button>
              ))}
            </div>
          </div>
        </div>
        {voices.length > 0 && (!hasAccent('en-US') || !hasAccent('en-GB')) && (
          <p className="text-xs text-muted mt-3">* В вашей системе нет голоса с этим акцентом, будет использован другой английский голос.</p>
        )}
        {err && <p className="text-sm text-red mt-3">{err}</p>}
      </Panel>

      {word.trim() && (
        <Panel className="fade-in">
          <div className="flex flex-wrap items-baseline justify-between gap-2">
            <h3 className="font-display text-xl font-semibold flex items-center gap-2"><Languages size={19} className="text-indigo" /> Транскрипция</h3>
            {loading && <span className="text-xs text-muted inline-flex items-center gap-1.5"><Loader2 size={14} className="animate-spin" /> Ищем в словаре…</span>}
          </div>
          <div className="mt-3 flex flex-wrap items-baseline gap-x-3 gap-y-1">
            <span className="font-display text-3xl font-semibold break-words" lang="en">{corrected || word.trim()}</span>
            {view.pos && <span className="text-sm text-muted">{view.pos}</span>}
          </div>
          {view.ru && <p className="mt-1 flex items-center gap-2"><Flag code="ru" className="w-5 h-3.5" title="Перевод на русский" /> {view.ru}</p>}
          {view.def && <p className="text-sm text-muted mt-1" lang="en">{view.def}</p>}

          <div className="grid gap-3 sm:grid-cols-2 mt-4">
            {[['us', 'en-US', 'Американское', view.ipaUS, view.audioUS], ['gb', 'en-GB', 'Британское', view.ipaUK, view.audioUK]].map(([f, lang, l, ipa, rec]) => (
              <div key={f} className="rounded-xl border-2 border-line p-4 flex flex-col gap-3">
                <div className="flex items-center gap-2 text-sm text-muted"><Flag code={f} className="w-6 h-4" /> {l} произношение</div>
                <p className="text-2xl tracking-wide" style={{ fontFamily: '"Lexend", "Segoe UI", "Arial Unicode MS", "Noto Sans", sans-serif' }}>
                  {ipa || <span className="text-base text-muted">{loading ? '…' : 'нет в словаре'}</span>}
                </p>
                <div className="flex flex-wrap gap-2">
                  <button type="button" onClick={() => speak(corrected || word, { lang, id: 'ipa:' + f })} disabled={!supported}
                    className={`inline-flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg border-2 transition-all duration-200 disabled:opacity-50 ${speaking === 'ipa:' + f ? 'border-green bg-greenSoft text-green' : 'border-line hover:border-indigo'}`}>
                    <Volume2 size={15} /> Голос
                  </button>
                  {rec && (
                    <button type="button" onClick={() => playRecording(rec, 'rec:' + f)}
                      className={`inline-flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg border-2 transition-all duration-200 ${speaking === 'rec:' + f ? 'border-green bg-greenSoft text-green' : 'border-line hover:border-indigo'}`}>
                      <PlayCircle size={15} /> Запись носителя
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>
          {view.tip && <p className="mt-4 text-sm flex gap-2 items-start bg-amberSoft rounded-xl px-3 py-2.5"><Lightbulb size={16} className="text-amber shrink-0 mt-0.5" /> {view.tip}</p>}
          {lookupNote && <p className="text-sm text-muted mt-3">{lookupNote}</p>}
          <p className="text-xs text-muted mt-4">
            Источник: {(isFresh ? analysis.source : 'builtin').split('+').map((k, i) => {
              const src = SOURCES[k] || SOURCES.builtin;
              return <React.Fragment key={k}>{i > 0 && ', '}{src.url ? <a href={src.url} target="_blank" rel="noopener" className="text-indigo underline">{src.label}</a> : src.label}</React.Fragment>;
            })}
            {isFresh && analysis.ruSource === 'mymemory' && <> · перевод: <a href="https://mymemory.translated.net" target="_blank" rel="noopener" className="text-indigo underline">MyMemory</a></>}
            {isFresh && analysis.spellSource === 'lt' && <> · орфография: <a href="https://languagetool.org" target="_blank" rel="noopener" className="text-indigo underline">LanguageTool</a></>}
            {isFresh && analysis.tokens.some((t) => t.source === 'datamuse') && <> · подсказки: <a href="https://www.datamuse.com/api/" target="_blank" rel="noopener" className="text-indigo underline">Datamuse</a></>}
            {' · '}Транскрипция записана знаками МФА: ˈ — ударный слог, ː — долгий звук.
          </p>
        </Panel>
      )}

      <Panel>
        <h3 className="font-display text-xl font-semibold flex items-center gap-2"><Lightbulb size={19} className="text-amber" /> Слова, которые часто произносят неправильно</h3>
        <p className="text-sm text-muted mt-1">Нажмите, чтобы послушать и увидеть транскрипцию.</p>
        <div className="flex flex-wrap gap-2 mt-4">
          {SAY_EXAMPLES.map((w) => (
            <button key={w} onClick={() => submit(w)}
              className={`inline-flex items-center gap-1.5 px-3 py-2 rounded-xl border-2 transition-all duration-200 ${speaking === 'ex:' + w ? 'border-green bg-greenSoft text-green scale-105' : 'border-line bg-surface2 hover:border-indigo hover:-translate-y-0.5'}`}>
              <Volume2 size={15} /> {w}
            </button>
          ))}
        </div>
        {history.length > 0 && (
          <div className="mt-5 pt-4 border-t border-line">
            <p className="text-sm text-muted">Вы слушали</p>
            <div className="flex flex-wrap gap-2 mt-2">
              {history.map((w) => (
                <button key={w} onClick={() => submit(w)} className="text-sm px-3 py-1 rounded-full border border-line transition-colors duration-200 hover:border-indigo">{w}</button>
              ))}
            </div>
          </div>
        )}
      </Panel>
    </div>
  );
}

/* ---------- Приложение ---------- */
const NAV_GROUPS = [
  { title: null, items: [{ key: 'home', label: 'Главная', icon: Home }] },
  { title: 'Грамматика', items: [
    { key: 'tenses', label: 'Времена глаголов', icon: Clock },
    { key: 'tobe', label: 'Глагол TO BE', icon: Sparkles },
    { key: 'possessive', label: 'Притяжательный падеж', icon: Quote },
  ] },
  { title: 'Тренажёры', items: [
    { key: 'checker', label: 'Проверка текста', icon: SpellCheck },
    { key: 'pronounce', label: 'Произношение', icon: Volume2 },
  ] },
];
const NAV = NAV_GROUPS.flatMap((g) => g.items);

function NavList({ view, go, progress }) {
  const counts = {
    tenses: [TENSE_QUIZ.filter((q) => progress[q.id]).length, TENSE_QUIZ.length],
    tobe: [TOBE_QUIZ.filter((q) => progress[q.id]).length, TOBE_QUIZ.length],
    possessive: [APOS.filter((q) => progress[q.id]).length, APOS.length],
  };
  return (
    <nav aria-label="Разделы" className="flex flex-col gap-4">
      {NAV_GROUPS.map((g, gi) => (
        <div key={gi}>
          {g.title && <p className="px-3 mb-1.5 text-[11px] uppercase tracking-[0.12em] text-muted font-medium">{g.title}</p>}
          <ul className="flex flex-col gap-0.5">
            {g.items.map(({ key, label, icon: Ic }) => {
              const on = view === key;
              const c = counts[key];
              return (
                <li key={key}>
                  <button onClick={() => go(key)} aria-current={on ? 'page' : undefined}
                    className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm text-left transition-all duration-200 ${on ? 'bg-indigoSoft text-indigo font-medium' : 'text-ink hover:bg-surface2'}`}>
                    <Ic size={17} className={on ? 'text-indigo' : 'text-muted'} />
                    <span className="flex-1">{label}</span>
                    {c && <span className={`text-[11px] tnum ${c[0] === c[1] ? 'text-green font-semibold' : 'text-muted'}`}>{c[0]}/{c[1]}</span>}
                  </button>
                </li>
              );
            })}
          </ul>
        </div>
      ))}
    </nav>
  );
}

function AudienceBadge() {
  return (
    <div className="flex items-center gap-2 text-xs text-muted">
      <span className="inline-flex -space-x-1.5">
        <Flag code="gb" round className="w-5 h-5" title="Великобритания" />
        <Flag code="us" round className="w-5 h-5" title="США" />
      </span>
      <span>English</span>
      <ArrowRight size={12} />
      <Flag code="ru" round className="w-5 h-5" title="Россия" />
      <span>для русскоязычных</span>
    </div>
  );
}

function App() {
  const [view, setView] = useState('home');
  const [progress, setProgress] = useState(loadProgress);
  const [toast, setToast] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => { saveProgress(progress); }, [progress]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 1800); return () => clearTimeout(t); }, [toast]);
  useEffect(() => {
    if (!menuOpen) return;
    const onKey = (e) => { if (e.key === 'Escape') setMenuOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [menuOpen]);

  const onCorrect = (id) => {
    if (progress[id]) return;
    setToast('+1 к прогрессу');
    setProgress((p) => (p[id] ? p : { ...p, [id]: true }));
  };
  const go = (k) => { setView(k); setMenuOpen(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const correct = Object.keys(progress).length;
  const current = NAV.find((n) => n.key === view);
  const group = NAV_GROUPS.find((g) => g.items.some((i) => i.key === view));

  return (
    <div className="min-h-screen">
      <header className="sticky z-30 bg-surface border-b border-line" style={{ top: 'env(safe-area-inset-top, 0px)' }}>
        <FlagRibbon />
        <div className="gutter max-w-6xl mx-auto py-2.5 flex items-center gap-3">
          <button onClick={() => setMenuOpen((o) => !o)} aria-expanded={menuOpen} aria-label="Открыть меню разделов"
            className="lg:hidden w-10 h-10 -ml-1 rounded-xl flex items-center justify-center hover:bg-surface2 transition-colors">
            {menuOpen ? <X size={21} /> : <Menu size={21} />}
          </button>
          <button onClick={() => go('home')} className="flex items-center gap-2.5 min-w-0">
            <span className="relative w-9 h-9 rounded-xl bg-indigo text-surface flex items-center justify-center shrink-0">
              <BookOpen size={19} />
            </span>
            <span className="min-w-0 text-left">
              <span className="block font-display text-lg font-semibold leading-tight">Easy English</span>
              <span className="block text-[11px] text-muted leading-tight lg:hidden truncate">{group && group.title ? group.title + ' · ' : ''}{current ? current.label : ''}</span>
            </span>
          </button>
          <span className="ml-auto text-sm inline-flex items-center gap-1.5 bg-greenSoft text-green px-3 py-1 rounded-full font-medium tnum shrink-0">
            <Trophy size={15} /> {correct} / {TOTAL}
          </span>
        </div>
      </header>

      {/* Мобильное меню */}
      <div className={`lg:hidden fixed inset-0 z-20 transition-opacity duration-300 ${menuOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} aria-hidden={!menuOpen}>
        <div className="absolute inset-0" style={{ background: 'color-mix(in srgb, var(--ink) 35%, transparent)' }} onClick={() => setMenuOpen(false)} />
        <div className={`absolute left-0 top-0 bottom-0 w-[280px] max-w-[85vw] bg-surface border-r border-line shadow-xl transition-transform duration-300 ease-out overflow-y-auto ${menuOpen ? 'translate-x-0' : '-translate-x-full'}`}
          style={{ paddingTop: 'calc(76px + env(safe-area-inset-top, 0px))', paddingLeft: 'max(12px, env(safe-area-inset-left, 0px))', paddingRight: '12px', paddingBottom: 'calc(20px + env(safe-area-inset-bottom, 0px))' }}>
          <NavList view={view} go={go} progress={progress} />
          <div className="mt-6 px-3 pt-4 border-t border-line"><AudienceBadge /></div>
        </div>
      </div>

      <div className="gutter max-w-6xl mx-auto lg:grid lg:grid-cols-[230px_minmax(0,1fr)] lg:gap-8">
        <aside className="hidden lg:block">
          <div className="sticky py-8" style={{ top: 'calc(64px + env(safe-area-inset-top, 0px))' }}>
            <NavList view={view} go={go} progress={progress} />
          </div>
        </aside>
        <main className="py-8 min-w-0">
          {view === 'home' && <HomeView progress={progress} go={go} reset={() => setProgress({})} />}
          {view === 'tenses' && <TensesView progress={progress} onCorrect={onCorrect} />}
          {view === 'tobe' && <ToBeView progress={progress} onCorrect={onCorrect} />}
          {view === 'possessive' && <PossessiveView progress={progress} onCorrect={onCorrect} />}
          {view === 'checker' && <CheckerView />}
          {view === 'pronounce' && <PronounceView />}
        </main>
      </div>

      <footer className="gutter max-w-6xl mx-auto pb-10 flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-muted">
        <span className="inline-flex items-center gap-1.5"><Flag code="gb" className="w-5 h-3.5" /><Flag code="us" className="w-5 h-3.5" /><Flag code="ru" className="w-5 h-3.5" /></span>
        <span>Easy English Grammar Hub · британский и американский английский для русскоязычных учеников · прогресс сохраняется в этом браузере</span>
      </footer>

      {toast && (
        <div className="pop fixed z-40 bg-green text-surface px-4 py-2 rounded-full font-medium shadow-lg"
          style={{ bottom: 'calc(20px + env(safe-area-inset-bottom, 0px))', right: 'max(20px, env(safe-area-inset-right, 0px))' }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
